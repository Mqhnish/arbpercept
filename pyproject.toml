[project]
name = "arbdata"
version = "0.1.0"
description = "Leakage-safe market data pipeline for cross-asset arbitrage decay research"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "sortedcontainers",
    "requests",
    "pyyaml",
    "orjson",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]
# Models, evaluation and analysis (arbtrade, analysis/)
models = ["scikit-learn", "numba", "lifelines", "matplotlib"]
# Live feeds: the recorder (python -m arbdata record) and the paper trader (python -m arbtrade.live)
live = ["websockets", "certifi"]
# Exact versions the tests last passed with: requirements-lock.txt
# (pip install -r requirements-lock.txt, then pip install -e . --no-deps)

[project.scripts]
arbdata = "arbdata.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arbdata", "arbtrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
